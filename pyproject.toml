[project]
name = "itvaya-backend"
version = "0.1.0"
description = "Backend for Itvaya Travel"
authors = [
    { name = "Developer" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "pydantic-settings>=2.3.4",
    "sqlalchemy>=2.0.31",
    "alembic>=1.13.2",
    "psycopg[binary]>=3.2.1",
    "asyncpg>=0.29.0",
    "passlib[argon2]>=1.7.4",
    "PyJWT>=2.8.0",
    "email-validator>=2.1.1",
    "python-multipart>=0.0.9",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0"
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "UP042", # str, Enum inheritance standard for SQLAlchemy models
    "E712",  # comparison to True in SQLAlchemy binary expressions
    "F821",  # undefined name in string type annotations
]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = [
    "tests",
]
