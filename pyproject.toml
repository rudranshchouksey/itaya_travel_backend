[project]
name = "itvaya-backend"
version = "0.1.0"
description = "Backend for Itvaya Travel"
authors = [
    { name = "Developer" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1"
]
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
addopts = "-v"
testpaths = [
    "tests",
]
